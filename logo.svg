  <rect x="18" y="15" width="3" height="18" rx="1.5" fill="white" fill-opacity="0.75"/>
  <rect x="23" y="12" width="3" height="24" rx="1.5" fill="white"/>
  <rect x="28" y="15" width="3" height="18" rx="1.5" fill="white" fill-opacity="0.75"/>
  <rect x="33" y="19" width="3" height="10" rx="1.5" fill="white" fill-opacity="0.5"/>
</svg>
